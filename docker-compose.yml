# GateOrchestra: API + console.
#   cp .env.example .env    # add GROQ_API_KEY (and GATE_API_TOKEN for a public server)
#   docker compose up --build
# Console: http://localhost:3700 (set WEB_PORT=3701 if 3700 is taken). The API is only
# reachable through it.
#
# All writable state (conversations, ratings, the answer cache, run history and any API
# key added from the console) lives in the "gateorchestra-data" named volume. A named
# volume, not a bind mount, because SQLite needs real file locking, which synced or
# network folders (Google Drive, OneDrive) do not provide.
services:
  api:
    build: .
    env_file: .env
    environment:
      ASSISTANT_DB_PATH: /app/logs/assistant.db
      ASSISTANT_ENV_PATH: /app/logs/keys.env
      GATE_CORS_ORIGINS: http://localhost:${WEB_PORT:-3700}
      # Run a Task uses Ollama on the host machine (inside a container, localhost is the container).
      GATE_API_BASE: ${GATE_API_BASE:-http://host.docker.internal:11434}
    volumes:
      - gateorchestra-data:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  web:
    build: ./frontend-react
    ports:
      - "${WEB_PORT:-3700}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  gateorchestra-data:
