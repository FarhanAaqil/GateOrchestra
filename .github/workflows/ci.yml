name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# A newer push to the same branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          python -m spacy download en_core_web_sm

      - name: Lint with Ruff
        run: ruff check .

      - name: Format check with Black
        run: black --check .

      - name: Type check with MyPy
        run: mypy shared/ gate/ integration/

      - name: Run tests with coverage
        run: pytest --cov=shared --cov=gate --cov=integration --cov=agents --cov=evaluation --cov=api --cov=dataset --cov=assistant --cov-report=term-missing --cov-fail-under=80

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install
        run: |
          pip install .
          python -m spacy download en_core_web_sm
          npm ci --prefix frontend-react

      - name: Start the API on the offline mock provider
        env:
          ASSISTANT_PROVIDERS: mock
          ASSISTANT_DB_PATH: /tmp/e2e.db
        run: |
          nohup uvicorn api.main:app --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done

      - name: Build and serve the console
        working-directory: frontend-react
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000
        run: |
          npm run build
          nohup npx vite preview --port 4173 --strictPort > /tmp/web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ > /dev/null && break; sleep 1; done

      - name: Browser smoke test
        working-directory: frontend-react
        env:
          CHROME_PATH: /usr/bin/google-chrome
          BASE_URL: http://localhost:4173
        run: npm run e2e

      - name: Logs on failure
        if: failure()
        run: tail -n 60 /tmp/api.log /tmp/web.log

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -t gateorchestra-api .
      - name: Build the console image
        run: docker build -t gateorchestra-web frontend-react
