name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# A newer push to the same branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          python -m spacy download en_core_web_sm

      - name: Lint with Ruff
        run: ruff check .

      - name: Format check with Black
        run: black --check .

      - name: Type check with MyPy
        run: mypy shared/ gate/ integration/

      - name: Run tests with coverage
        run: pytest --cov=shared --cov=gate --cov=integration --cov=agents --cov=evaluation --cov=api --cov=dataset --cov=assistant --cov-report=term-missing --cov-fail-under=80

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install
        run: |
          pip install .
          python -m spacy download en_core_web_sm
          npm ci --prefix frontend-react

      - name: Start the API on the offline mock provider
        env:
          ASSISTANT_PROVIDERS: mock
          ASSISTANT_DB_PATH: /tmp/e2e.db
        run: |
          nohup uvicorn api.main:app --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done

      - name: Build and serve the console
        working-directory: frontend-react
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8000
        run: |
          npm run build
          nohup npx vite preview --port 4173 --strictPort > /tmp/web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ > /dev/null && break; sleep 1; done

      - name: Browser smoke test
        working-directory: frontend-react
        env:
          CHROME_PATH: /usr/bin/google-chrome
          BASE_URL: http://localhost:4173
        run: npm run e2e

      - name: Start the API in hosted mode (offline mock model, emails to a file)
        env:
          E2E_DATA: /tmp/e2e-hosted
          E2E_ORIGIN: http://127.0.0.1:4174
        run: |
          nohup python scripts/e2e_hosted_server.py > /tmp/hosted-api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8001/health && break; sleep 1; done

      - name: Build and serve the console for hosted mode
        working-directory: frontend-react
        env:
          VITE_API_BASE_URL: http://127.0.0.1:8001
        run: |
          npx vite build --outDir dist-hosted
          nohup npx vite preview --outDir dist-hosted --host 127.0.0.1 --port 4174 --strictPort > /tmp/hosted-web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4174/ > /dev/null && break; sleep 1; done

      - name: Hosted-mode browser test (accounts, isolation, admin pages, accessibility)
        working-directory: frontend-react
        env:
          CHROME_PATH: /usr/bin/google-chrome
          BASE_URL: http://127.0.0.1:4174
          MAIL_LOG: /tmp/e2e-hosted/mail.log
        run: npm run e2e:hosted

      - name: Logs on failure
        if: failure()
        run: tail -n 60 /tmp/api.log /tmp/web.log /tmp/hosted-api.log /tmp/hosted-web.log

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -t gateorchestra-api .
      - name: Build the console image
        run: docker build -t gateorchestra-web frontend-react
      - name: The console's nginx configuration is valid
        run: docker run --rm --add-host api:127.0.0.1 gateorchestra-web nginx -t

      - name: Write a hosted-mode .env (generated secrets, placeholder key, emails kept in memory)
        run: |
          pip install -q cryptography
          python scripts/make_env.py --domain gate.example.com --admin-email admin@example.com
          echo "GROQ_API_KEY=gsk_ci_placeholder_not_a_real_key_0000000000" >> .env
          echo "GATE_MAIL_BACKEND=console" >> .env

      - name: Boot the full stack in hosted mode
        run: |
          docker compose up -d --build --wait --wait-timeout 180
          curl -sf http://localhost:3700/api/ | grep -q '"hosted":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3700/api/auth/me)" = 401
          curl -sI http://localhost:3700/api/auth/me | grep -qi '^cache-control: no-store'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3700/api/assistant/stats)" = 403
          curl -sI http://localhost:3700/ | grep -qi '^content-security-policy:'
          curl -sI http://localhost:3700/assets/ | grep -qi '^x-frame-options:' || true
          echo "hosted stack is up and locked down"

      - name: An unsafe hosted configuration refuses to start
        run: |
          set +e
          timeout 120 docker compose run --rm --no-deps -e GATE_CORS_ORIGINS='*' api > /tmp/unsafe.log 2>&1
          code=$?
          set -e
          cat /tmp/unsafe.log | tail -n 15
          test "$code" -ne 0
          grep -q "not safe to start" /tmp/unsafe.log

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --tail 80

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python runtime dependencies have no known vulnerabilities
        run: |
          pip install -q pip-audit
          python scripts/runtime_requirements.py > /tmp/requirements.txt
          pip-audit -r /tmp/requirements.txt
      - name: The shipped console has no high-severity vulnerabilities
        working-directory: frontend-react
        run: npm audit --omit=dev --audit-level=high
