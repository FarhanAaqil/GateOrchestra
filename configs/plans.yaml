# Plans for hosted mode (GATE_HOSTED=true). The server enforces every limit here.
#
# Why these numbers: a typical chat turn here costs a few thousand tokens, and the
# gate keeps most turns on the cheap path. Free covers a couple of dozen questions a
# day so people can judge the product. Pro's token cap is set so that a person who
# hits it every day still costs roughly what they pay at typical cloud prices for
# the answer model; most people use far less. Check your provider's current prices
# (and terms of use) before taking money, and change these to match.
#
# Limits:
#   messages_per_day  answered chat turns per UTC day
#   documents         uploaded documents stored at once
#   daily_tokens      tokens per UTC day on the operator's keys (turns answered with
#                     the person's own key do not count towards this)
#   concurrent_chats  answers in progress at the same time

default_plan: free

plans:
  free:
    label: Free
    price_usd_month: 0
    messages_per_day: 30
    documents: 3
    daily_tokens: 40000
    concurrent_chats: 1
    blurb: Try it on everyday questions.

  pro:
    label: Pro
    price_usd_month: 9
    messages_per_day: 400
    documents: 100
    daily_tokens: 1000000
    concurrent_chats: 3
    blurb: For daily use, research questions and longer documents.

# The operator's safety switch: tokens per UTC day across everyone, on the
# operator's keys. GATE_GLOBAL_DAILY_TOKENS overrides it.
global_daily_tokens: 3000000
