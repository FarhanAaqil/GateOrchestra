# GateOrchestra — Default Configuration
# All values here mirror shared/config.py constants.
# YAML is used so non-Python tools (notebooks, scripts) can load config easily.

model:
  name: "Qwen2.5-7B-Instruct"
  api_base: "http://localhost:11434"   # Ollama local; override via GATE_API_BASE env var

probe:
  token_budget: 500      # Max tokens per probe run
  n_samples: 5           # Number of CoT-SC samples
  temperature: 0.7       # Sampling temperature

gate:
  tau_acc: 0.05          # Accuracy delta threshold for ESCALATE labeling
  k: 3                   # Default token budget multiplier (MAS budget = k × probe_tokens)
  classifier: "gbt"      # Default classifier: logreg | gbt | mlp

  # Hyperparameter sweep grids (used in train_gate.py)
  tau_acc_sweep: [0.03, 0.05, 0.08]
  k_sweep: [2, 3, 5]

  # Rule-based gate thresholds
  rule_consistency_stop: 0.8
  rule_entity_stop: 3
  rule_depth_escalate: 3.0
  rule_parallel_escalate: 2.0

dataset:
  train_split: 0.60
  val_split: 0.20
  test_split: 0.20
  random_seed: 42

features:
  use_spacy: true
  spacy_model: "en_core_web_sm"

paths:
  dataset: "dataset/masbench_mini"
  logs: "logs"
  models: "configs/models"
