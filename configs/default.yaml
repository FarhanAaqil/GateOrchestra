# GateOrchestra — Default Configuration
# A read-only mirror of shared/config.py for non-Python tools (notebooks, reports).
# shared/config.py is the source of truth; tests/test_config_consistency.py
# fails if the two disagree.

model:
  provider: "ollama"                 # GATE_LLM_PROVIDER: ollama | groq | mock
  name: "qwen2.5:7b-instruct"        # GATE_MODEL_NAME (Ollama tag)
  api_base: "http://localhost:11434" # GATE_API_BASE
  groq_name: "qwen/qwen3.8-27b"      # GROQ_MODEL_NAME (used when provider is groq)

probe:
  token_budget: 1000     # Completion tokens for the whole probe, split across samples
  n_samples: 3           # Number of CoT-SC samples
  temperature: 0.7       # Sampling temperature

gate:
  tau_acc: 0.05          # Accuracy delta threshold for ESCALATE labeling
  n_repeats: 3           # Independent train/validation runs per task for label aggregation
  k: 3                   # Default token budget multiplier (MAS budget = k × probe_tokens)
  classifier: "gbt"      # Default classifier: logreg | gbt | mlp

  # Hyperparameter sweep grids (used in train_gate.py)
  tau_acc_sweep: [0.03, 0.05, 0.08]
  k_sweep: [2, 3, 5]

  # Rule-based gate thresholds
  rule_consistency_stop: 0.8
  rule_entity_stop: 3
  rule_depth_escalate: 3.0
  rule_parallel_escalate: 2.0

dataset:
  train_split: 0.60
  val_split: 0.20
  test_split: 0.20
  random_seed: 42

features:
  use_spacy: true
  spacy_model: "en_core_web_sm"

paths:
  dataset: "dataset/masbench_mini"
  logs: "logs"
  models: "configs/models"
